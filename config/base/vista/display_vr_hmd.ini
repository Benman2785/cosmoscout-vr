[SYSTEM]
DISPLAYSYSTEMS   = MAIN
WINDOWINGTOOLKIT = OPENVR_SDL2
INTERACTIONINI	 = interaction_hmd.ini
GRAPHICSSECTION  = GRAPHICS
OUTPUT           = OUTPUT

[GRAPHICS]
BACKGROUNDCOLOR  = 0.0, 0.0, 0.0

############################ windows ##################################

[MIRROR_WINDOW]
NAME                = MIRROR_WINDOW
STEREO              = false
SIZE                = 1280, 800
FULLSCREEN          = false
TITLE               = CosmoScout VR
VSYNC               = false

######################## display systems ##############################

[FRAME_MIRROR]
TRANSLATION         = 0, 0, 0

[MAIN]
NAME                = MAIN
VIEWPORTS           = MIRROR_VIEWPORT
REFERENCE_FRAME     = FRAME_MIRROR
HMD_MODE            = true

[MIRROR_VIEWPORT]
NAME                = MIRROR_VIEWPORT
PROJECTION          = PROJECTION_OPENVR
WINDOW              = MIRROR_WINDOW
RESIZE_WITH_WINDOW  = false
TYPE                = OPENVR

[PROJECTION_OPENVR]
NAME                = PROJECTION_OPENVR
CLIPPING_RANGE      = 0.2, 5000
STEREO_MODE         = MONO

########################## cluster ################################

[VR]
NAME                = VR
DISPLAYSYSTEMS      = MAIN
SLAVES              = MONITOR
WINDOWINGTOOLKIT    = OPENVR_SDL2
DATASYNCTYPE        = TCP/IP
BARRIERTYPE         = TCP/IP
SWAPSYNCTYPE        = NONE
FREEPORTS           = 50000-50100

[MONITOR]
NAME                = MONITOR
DISPLAYSYSTEMS      = MAIN
SLAVEIP             = 127.0.0.1
SLAVEPORT           = 50000